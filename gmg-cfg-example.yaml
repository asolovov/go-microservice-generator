root: ./example
go-package: example_service
go-mod-generate: false

cfg:
  generate: true

app:
  generate: true

cmd:
  generate: true

service:
  generate: true

grpc-server:
  generate: true
  default-addr: 0.0.0.0:9090

  proto-service:
    path: /protocols/user
    pb-name: UserService
    go-name: user_pb

  proto-models:
    path: /protocols/user
    go-name: user_pb

repository:
  generate: true
  default-addr: postgres://postgres:postgres@localhost:5432/users?sslmode=disable

models:
  ai:
    generate: true
    domain-model-paths:
      - /models/user.go
    pb-model-paths:
      - /protocols/user/models_user.proto
    migration-paths:
      - /migrations/000001_users.up.sql
    parsing-rules:
      proto-domain:
        User: User
      domain-db:
        User: users